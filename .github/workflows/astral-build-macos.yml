# Astral fork: one macOS arm64 cross-build on a GitHub-hosted Linux runner.
# Called by astral-build.yml twice for PGO: first `instrumented` (the
# profile-generate build that astral-profile runs), then `final` (profile-use
# plus ThinLTO, like upstream's macos-release-build.yml step 3).
name: Astral macOS cross-build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      stage:
        description: "instrumented or final"
        type: string
        default: final
      pgo-key:
        description: "Cache key of the profile data; empty builds without PGO"
        type: string
        default: ""
      lto:
        type: boolean
        default: true
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      sha:
        value: ${{ jobs.build.outputs.sha }}

jobs:
  build:
    name: Build macOS aarch64 (${{ inputs.stage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      SURFER_COMPAT: aarch64
      SURFER_PLATFORM: darwin
      ZEN_CROSS_COMPILING: 1
      ZEN_RELEASE_BRANCH: release
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          swap-storage: false

      # Instrumented compiles of the big unified C++ sources (dom/base) can
      # exhaust the runner's 16 GB; the runner then dies with a shutdown signal.
      - name: Add swap
        run: |
          sudo fallocate -l 16G /astral.swap
          sudo chmod 600 /astral.swap
          sudo mkswap /astral.swap
          sudo swapon /astral.swap
          free -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Version
        id: version
        run: |
          v=$(jq -r '.brands.release.release.displayVersion' surfer.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building Zen $v at $(git rev-parse HEAD), stage ${{ inputs.stage }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          disable_annotations: true

      - name: Expose actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '')
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'] || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '')

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip zstd yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb --fix-missing

      - name: Load Surfer CI setup
        run: npm run surfer -- ci --brand release --display-version ${{ steps.version.outputs.version }}

      - name: Download Firefox
        run: npm run download

      - name: mac-cross cache
        id: cache-mac-cross
        uses: actions/cache@v4
        with:
          path: ~/mac-cross
          key: mac-cross-v1

      - name: Setup for macOS (cctools and DMG tools)
        if: steps.cache-mac-cross.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p ~/mac-cross
          cd engine/
          ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
          mv cctools dmg hfsplus ~/mac-cross/
          ls ~/mac-cross/cctools/bin/aarch64-apple-darwin-ld ~/mac-cross/dmg/dmg ~/mac-cross/hfsplus/newfs_hfs

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          . "$HOME/.cargo/env"
          rustup target add aarch64-apple-darwin

      - name: Import patches
        run: |
          . "$HOME/.cargo/env"
          npm run import -- --verbose

      - name: Bootstrap
        run: npm run bootstrap

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Restore profile data
        if: ${{ inputs.stage == 'final' && inputs.pgo-key != '' }}
        uses: actions/cache/restore@v4
        with:
          key: ${{ inputs.pgo-key }}
          path: ~/artifact
          fail-on-cache-miss: true

      - name: Build
        env:
          ZEN_SAFEBROWSING_API_KEY: ${{ secrets.ZEN_SAFEBROWSING_API_KEY }}
          ZEN_GOOGLE_LOCATION_SERVICE_API_KEY: ${{ secrets.ZEN_GOOGLE_LOCATION_SERVICE_API_KEY }}
        run: |
          mkdir -p ~/.zen-keys
          test -z "$ZEN_SAFEBROWSING_API_KEY" || echo "$ZEN_SAFEBROWSING_API_KEY" > ~/.zen-keys/safebrowsing.dat
          test -z "$ZEN_GOOGLE_LOCATION_SERVICE_API_KEY" || echo "$ZEN_GOOGLE_LOCATION_SERVICE_API_KEY" > ~/.zen-keys/google_location_service.dat
          set -x
          ( while sleep 300; do free -m | awk 'NR==2{m=$3"/"$2} NR==3{s=$3} END{print "mem MB " m ", swap " s}'; done ) &
          if test "${{ inputs.stage }}" = instrumented; then
            # LTO only matters for the shipped binary; the instrumented one just records counts.
            # Four instrumented jobs (C++ plus gkrust) outgrow the runner's RAM even with swap.
            export ZEN_GA_GENERATE_PROFILE=1 ZEN_DISABLE_LTO=1 MOZ_PARALLEL_BUILD=3
          else
            test -n "${{ inputs.pgo-key }}" || export ZEN_GA_DISABLE_PGO=1
            test "${{ inputs.lto }}" = true || export ZEN_DISABLE_LTO=1
            test -z "${{ inputs.pgo-key }}" || ls -la ~/artifact/merged.profdata ~/artifact/en-US.log
          fi
          df -h /
          . "$HOME/.cargo/env"
          ulimit -n 4096
          ZEN_RELEASE=1 npm run build
          rm -rf ~/.zen-keys
          df -h /

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Package
        run: |
          set -ex
          if test "${{ inputs.stage }}" = instrumented; then
            export ZEN_GA_GENERATE_PROFILE=1
          else
            export ZEN_GA_DISABLE_PGO=1
          fi
          cd engine
          ZEN_RELEASE=1 ./mach package
          ls -la obj-aarch64-apple-darwin/dist/*.dmg

      - name: Collect artifacts
        run: |
          set -ex
          name="zen-astral-${{ steps.version.outputs.version }}-macos-aarch64"
          test "${{ inputs.stage }}" = final || name="$name-pgo-stage1"
          mkdir -p out
          mv engine/obj-aarch64-apple-darwin/dist/*.dmg "out/$name.dmg"
          cp engine/obj-aarch64-apple-darwin/dist/bin/platform.ini out/platform.ini
          (cd out && sha256sum "$name.dmg" > "$name.dmg.sha256")
          cat out/*.sha256 out/platform.ini

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.stage == 'final' && 'zen-astral-macos-aarch64' || 'astral-pgo-stage1' }}
          path: out/
          retention-days: ${{ inputs.stage == 'final' && 7 || 2 }}
