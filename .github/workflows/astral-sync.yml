# Astral fork: prepare and test an upstream integration PR. Publication is
# separate so an upstream merge cannot silently replace the customized build.
name: Astral upstream sync

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to merge (default: the newest release)"
        type: string
        default: ""
      branch:
        description: "Target branch for the integration PR"
        type: string
        default: astral
      build:
        description: "Build the candidate without publishing it"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: astral-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Prepare upstream integration
    runs-on: ubuntu-24.04
    outputs:
      merged: ${{ steps.sync.outputs.merged }}
      tag: ${{ steps.sync.outputs.tag }}
      candidate: ${{ steps.sync.outputs.candidate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'astral' }}
          fetch-depth: 0
          filter: blob:none

      - name: Sync
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ inputs.branch || 'astral' }}
        run: bash .github/workflows/src/astral-sync.sh

  checks:
    needs: sync
    if: ${{ needs.sync.outputs.merged == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.candidate }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run test:astral

  build:
    needs: [sync, checks]
    if: ${{ inputs.build && needs.sync.outputs.merged == 'true' }}
    uses: ./.github/workflows/astral-build.yml
    secrets: inherit
    with:
      ref: ${{ needs.sync.outputs.candidate }}
      publish: false
