# Astral fork: macOS arm64 build of the `astral` branch, cross-compiled on a
# GitHub-hosted Linux runner like upstream's macos-release-build.yml, minus
# everything that needs Zen's secrets (signing, notarization, MAR upload).
#
# PGO mirrors upstream's build.yml mac-step-1..3: an instrumented build, a
# profile run on a macOS runner, then the shipped build with profile-use and
# ThinLTO. The profile is cached per Zen version and PGO training inputs, so
# rebuilds of `astral` between upstream syncs skip the first two stages.
name: Astral macOS build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        type: string
        default: astral
      publish:
        description: "Publish a GitHub Release"
        type: boolean
        default: true
      pgo:
        description: "Profile-guided optimization (adds about 3 hours without a cached profile)"
        type: boolean
        default: true
      lto:
        description: "ThinLTO"
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        default: astral
      publish:
        type: boolean
        default: true
      pgo:
        type: boolean
        default: true
      lto:
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: astral-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  pgo-cache:
    name: Probe cached PGO profile
    if: ${{ inputs.pgo }}
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build the cache key
        id: key
        env:
          INPUTS_HASH: ${{ hashFiles('src/zen/common/sys/ZenPGOTraining.sys.mjs', 'src/build/pgo/**', 'src/testing/profiles/profileserver/**', 'scripts/download_pgo_extended_corpus.py', 'configs/macos/mozconfig', 'configs/common/mozconfig') }}
        run: |
          v=$(jq -r '.brands.release.release.displayVersion' surfer.json)
          echo "key=astral-pgo-v1-macos-aarch64-$v-$INPUTS_HASH" >> "$GITHUB_OUTPUT"

      - name: Probe
        id: probe
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: ~/artifact
          lookup-only: true

  instrumented:
    name: PGO step 1 (instrumented build)
    needs: pgo-cache
    if: ${{ inputs.pgo && needs.pgo-cache.outputs.hit != 'true' }}
    uses: ./.github/workflows/astral-build-macos.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      stage: instrumented

  profile:
    name: PGO step 2 (generate profile data)
    needs: [pgo-cache, instrumented]
    if: ${{ inputs.pgo && needs.pgo-cache.outputs.hit != 'true' }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: actions/setup-python@v5

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)

      - name: Prepare source
        env:
          SURFER_NO_BRANDING_PATCH: true
        run: |
          npm ci
          v=$(jq -r '.brands.release.release.displayVersion' surfer.json)
          npm run surfer -- ci --brand release --display-version "$v"
          npm run download
          . "$HOME/.cargo/env"
          npm run import

      - name: Bootstrap
        run: |
          cd engine
          export SURFER_PLATFORM=darwin
          ./mach --no-interactive bootstrap --application-choice browser --exclude macos-sdk || true

      - name: Download instrumented app
        uses: actions/download-artifact@v4
        with:
          name: astral-pgo-stage1
          path: ~/instrumented

      - name: Extract instrumented app
        run: |
          set -ex
          cd engine
          ./mach python -m mozbuild.action.unpack_dmg "$HOME"/instrumented/*-pgo-stage1.dmg "$HOME/instrumented/app"
          APP=$(find "$HOME/instrumented/app" -maxdepth 1 -name "*.app" -type d | head -1)
          codesign --force --deep --sign - "$APP" || true

      - name: Generate profile data
        run: |
          set -ex
          export LLVM_PROFDATA="$HOME/.mozbuild/clang/bin/llvm-profdata"
          export JARLOG_FILE=en-US.log
          BINARY=$(find "$HOME/instrumented/app" -type f -path "*/Contents/MacOS/zen" | head -1)
          test -n "$BINARY"
          cd engine
          ./mach python ../scripts/download_pgo_extended_corpus.py
          ./mach python build/pgo/profileserver.py --binary "$BINARY" --extended-corpus ./pgo-extended-corpus
          mkdir -p ~/artifact
          mv merged.profdata en-US.log ~/artifact/
          ls -la ~/artifact

      - name: Cache profile data
        uses: actions/cache/save@v4
        with:
          key: ${{ needs.pgo-cache.outputs.key }}
          path: ~/artifact

  build:
    name: Build
    needs: [pgo-cache, profile]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/astral-build-macos.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      stage: final
      pgo-key: ${{ inputs.pgo && needs.pgo-cache.outputs.key || '' }}
      lto: ${{ inputs.lto }}

  release:
    name: Publish release
    needs: build
    if: ${{ !failure() && !cancelled() && inputs.publish && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: zen-astral-macos-aarch64
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
        run: bash .github/workflows/src/astral-release.sh out
