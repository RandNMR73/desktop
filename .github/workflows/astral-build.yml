# Astral fork: macOS arm64 build of the `astral` branch, cross-compiled on a
# GitHub-hosted Linux runner like upstream's macos-release-build.yml, minus
# everything that needs Zen's secrets (signing, notarization, MAR upload).
name: Astral macOS build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        type: string
        default: astral
      publish:
        description: "Publish a GitHub Release"
        type: boolean
        default: true
      lto:
        description: "Enable ThinLTO (slower; may not fit the 6h job limit)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        default: astral
      publish:
        type: boolean
        default: true
      lto:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: astral-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      SURFER_COMPAT: aarch64
      SURFER_PLATFORM: darwin
      ZEN_CROSS_COMPILING: 1
      ZEN_RELEASE_BRANCH: release
      ZEN_GA_DISABLE_PGO: 1
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Version
        id: version
        run: |
          v=$(jq -r '.brands.release.release.displayVersion' surfer.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building Zen $v at $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          disable_annotations: true

      - name: Expose actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '')
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'] || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '')

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip zstd yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb --fix-missing

      - name: Load Surfer CI setup
        run: npm run surfer -- ci --brand release --display-version ${{ steps.version.outputs.version }}

      - name: Download Firefox
        run: npm run download

      - name: mac-cross cache
        id: cache-mac-cross
        uses: actions/cache@v4
        with:
          path: ~/mac-cross
          key: mac-cross-v1

      - name: Setup for macOS (cctools and DMG tools)
        if: steps.cache-mac-cross.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p ~/mac-cross
          cd engine/
          ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
          mv cctools dmg hfsplus ~/mac-cross/
          ls ~/mac-cross/cctools/bin/aarch64-apple-darwin-ld ~/mac-cross/dmg/dmg ~/mac-cross/hfsplus/newfs_hfs

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          . "$HOME/.cargo/env"
          rustup target add aarch64-apple-darwin

      - name: Import patches
        run: |
          . "$HOME/.cargo/env"
          npm run import -- --verbose

      - name: Bootstrap
        run: npm run bootstrap

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Build
        env:
          ZEN_SAFEBROWSING_API_KEY: ${{ secrets.ZEN_SAFEBROWSING_API_KEY }}
          ZEN_GOOGLE_LOCATION_SERVICE_API_KEY: ${{ secrets.ZEN_GOOGLE_LOCATION_SERVICE_API_KEY }}
        run: |
          mkdir -p ~/.zen-keys
          test -z "$ZEN_SAFEBROWSING_API_KEY" || echo "$ZEN_SAFEBROWSING_API_KEY" > ~/.zen-keys/safebrowsing.dat
          test -z "$ZEN_GOOGLE_LOCATION_SERVICE_API_KEY" || echo "$ZEN_GOOGLE_LOCATION_SERVICE_API_KEY" > ~/.zen-keys/google_location_service.dat
          set -x
          if test "${{ inputs.lto }}" != "true"; then
            export ZEN_DISABLE_LTO=1
          fi
          df -h /
          . "$HOME/.cargo/env"
          ulimit -n 4096
          ZEN_RELEASE=1 npm run build
          rm -rf ~/.zen-keys
          df -h /

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Package
        run: |
          set -ex
          cd engine
          ZEN_RELEASE=1 ./mach package
          ls -la obj-aarch64-apple-darwin/dist/*.dmg

      - name: Collect artifacts
        run: |
          set -ex
          name="zen-astral-${{ steps.version.outputs.version }}-macos-aarch64"
          mkdir -p out
          mv engine/obj-aarch64-apple-darwin/dist/*.dmg "out/$name.dmg"
          cp engine/obj-aarch64-apple-darwin/dist/bin/platform.ini out/platform.ini
          (cd out && sha256sum "$name.dmg" > "$name.dmg.sha256")
          cat out/*.sha256 out/platform.ini

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zen-astral-macos-aarch64
          path: out/
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: zen-astral-macos-aarch64
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
        run: bash .github/workflows/src/astral-release.sh out
