<!doctype html>
<meta charset="utf-8">
<title>Visited paint colors do not expose history through computed styles</title>
<link rel="help" href="https://drafts.csswg.org/selectors/#privacy">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  a {
    color: color(display-p3 0 0 1 / 0.5);
    background-color: color(display-p3 0 0 1 / 0.5);
    border-color: color(display-p3 0 0 1 / 0.5);
  }
  a:visited {
    color: color(display-p3 1 0.3 0 / 0);
    background-color: color(display-p3 1 0.3 0 / 0);
    border-color: color(display-p3 1 0.3 0 / 0);
  }
</style>
<a id="visited" href="">Current document</a>
<a id="control">No history state</a>
<script>
promise_test(async () => {
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const link = document.getElementById("visited");
  const control = document.getElementById("control");
  for (const property of ["color", "backgroundColor", "borderTopColor"]) {
    assert_equals(getComputedStyle(link)[property], getComputedStyle(control)[property], property);
  }
  assert_false(link.matches(":visited"));
  assert_equals(document.querySelector(":visited"), null);
}, "Visited RGB and alpha remain hidden from style and selector queries");
</script>
