<meta charset="utf-8">
<title>Wide-gamut blurred shadows retain alpha and repaint colors</title>
<link rel="help" href="https://drafts.csswg.org/css-backgrounds-3/#shadow-blur">
<link rel="stylesheet" href="resources/paint-paths.css">
<link rel="match" href="paint-blur-ref.html">

<style>

  .tile::before { content: ""; position: absolute; }
  .outer::before { inset: 32px; box-shadow: 0 0 8px 64px currentColor; }
  .inner::before { inset: -32px; box-shadow: inset 0 0 8px 128px currentColor; }

  <div class="tile inner alpha" data-paint-path="inner-blur-alpha"></div>
</div>
<div class="row">
  <div class="tile outer repaint" data-paint-path="outer-blur-repaint"></div>
  <div class="tile inner repaint" data-paint-path="inner-blur-repaint"></div>
</div>
<script>
  requestAnimationFrame(() => requestAnimationFrame(() => {

      document.documentElement.classList.remove("reftest-wait");
    }));
  }));
</script>
