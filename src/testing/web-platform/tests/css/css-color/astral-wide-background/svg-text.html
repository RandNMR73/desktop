<!doctype html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>Wide SVG text fills, paths, shadows and selections</title>
<link rel="help" href="https://svgwg.org/svg2-draft/text.html#TextRenderingOrder">
<link rel="stylesheet" href="resources/paint-paths.css">
<link rel="match" href="svg-text-ref.html">
<meta name="fuzzy" content="maxDifference=1;totalPixels=0-16384">
<style>
  .sample { display: block; position: relative; width: 16px; height: 16px; margin: 24px; overflow: hidden; }
  .sample svg { position: absolute; left: -24px; top: -24px; }
  svg { width: 64px; height: 64px; overflow: hidden; }
  text { font: 64px Ahem; fill: var(--paint); }
  .stroke text { fill: none; stroke: var(--paint); stroke-width: 64px; }
  .pattern text { fill: url(#paint); }
  .fallback text { fill: url(#missing) var(--paint); }
  .half { --paint: color(display-p3 1 0.30196078431372547 0 / 0.5019607843137255); }
  .fill-opacity text { fill-opacity: 0.5019607843137255; }
  .opacity { opacity: 0.5019607843137255; }
  .text-shadow text { text-shadow: 0 64px var(--paint); fill: blue; }
  .path-shadow text { stroke: blue; stroke-width: 1px; }
  .alpha-shadow text { fill: rgb(0 0 255 / 0.5019607843137255); }
  .blur text { text-shadow: 0 64px 2px var(--paint); }
  .decoration text { font-size: 1024px; text-decoration: underline; text-decoration-skip-ink: none; }
  #foreground, #background { fill: url(#blue-paint); }
  #foreground::selection { fill: color(display-p3 1 0.30196078431372547 0); }
  #background::selection { fill: transparent; background: color(display-p3 1 0.30196078431372547 0); }
</style>
<svg style="position:absolute;width:0;height:0">
  <defs><pattern id="paint" width="1" height="1" patternContentUnits="objectBoundingBox">
    <rect width="1" height="1" fill="color(display-p3 1 0.30196078431372547 0)"/>
  </pattern><pattern id="blue-paint" width="1" height="1" patternContentUnits="objectBoundingBox">
    <rect width="1" height="1" fill="blue"/>
  </pattern></defs>
</svg>
<div class="row">
  <div class="tile"><div class="sample"><svg><text x="0" y="51">X</text></svg></div></div>
  <div class="tile stroke"><div class="sample"><svg><text x="0" y="51">X</text></svg></div></div>
  <div class="tile pattern"><div class="sample"><svg><text x="0" y="51">X</text></svg></div></div>
  <div class="tile fallback"><div class="sample"><svg><text x="0" y="51">X</text></svg></div></div>
</div>
<div class="row">
  <div class="tile half"><div class="sample"><svg><text x="0" y="51">X</text></svg></div></div>
  <div class="tile fill-opacity"><div class="sample"><svg><text x="0" y="51">X</text></svg></div></div>
  <div class="tile stroke half"><div class="sample"><svg><text x="0" y="51">X</text></svg></div></div>
  <div class="tile opacity"><div class="sample"><svg><text x="0" y="51">X</text></svg></div></div>
</div>
<div class="row">
  <div class="tile text-shadow"><div class="sample"><svg><text x="0" y="-13">X</text></svg></div></div>
  <div class="tile text-shadow path-shadow"><div class="sample"><svg><text x="0" y="-13">X</text></svg></div></div>
  <div class="tile text-shadow alpha-shadow"><div class="sample"><svg><text x="0" y="-13">X</text></svg></div></div>
  <div class="tile text-shadow path-shadow blur"><div class="sample"><svg><text x="0" y="-13">X</text></svg></div></div>
</div>
<div class="row">
  <div class="tile decoration"><div class="sample"><svg><text x="0" y="-104.192">&nbsp;X</text></svg></div></div>
  <div class="tile decoration pattern"><div class="sample"><svg><text x="0" y="-104.192">&nbsp;X</text></svg></div></div>
  <div class="tile pattern"><div class="sample"><svg><text id="foreground" x="0" y="51">X</text></svg></div></div>
  <div class="tile pattern"><div class="sample"><svg><text id="background" x="0" y="51">X</text></svg></div></div>
</div>
<script>
  document.fonts.load("64px Ahem").then(() => {
    const range = new Range();
    range.setStart(document.getElementById("foreground").firstChild, 0);
    range.setEnd(document.getElementById("background").firstChild, 1);
    getSelection().addRange(range);
    document.documentElement.classList.remove("reftest-wait");
  });
</script>
</html>
