<!doctype html><html class="reftest-wait"><meta charset="utf-8"><title>Originating shadows under highlights</title>
<style>@font-face{font-family:Ahem;src:url(/fonts/Ahem.ttf)}body{margin:8px;display:grid;grid-template-columns:repeat(4,240px);gap:8px;background:white}.tile{height:174px}.label{font:12px sans-serif;height:22px;color:black}.pad{padding:24px}.sample{font:32px/1 Ahem;color:red}::selection{background-color:transparent}.label::selection{color:black}</style><!-- Keep every shadow layer: antialiased edges and translucent shadows reveal underlying colors. -->
<style>#c0{color:green;text-shadow:0 24px 0 red}#c1{color:green;text-shadow:0 -20px 0 blue, 0 24px 0 red}#c2{color:green;text-shadow:0 24px 0 red}#c3{color:green;text-shadow:0 -20px 0 green, 0 24px 0 red}#c4{color:green;text-shadow:0 24px 0 red}#c5{color:green;text-shadow:0 -20px 0 blue, 0 24px 0 red}#c6{color:green;text-shadow:0 24px 0 red}#c7{color:green;text-shadow:0 -20px 0 green, 0 24px 0 red}#c8{color:green;text-shadow:0 24px 0 blue, 0 24px 0 red}#c9{color:green;text-shadow:0 24px 0 blue, 0 24px 0 purple, 0 24px 0 red}</style><div class="tile"><div class="label">custom-none</div><div class="pad"><span class="sample" id="c0">XX</span></div></div><div class="tile"><div class="label">custom-separate</div><div class="pad"><span class="sample" id="c1">XX</span></div></div><div class="tile"><div class="label">custom-unspecified</div><div class="pad"><span class="sample" id="c2">XX</span></div></div><div class="tile"><div class="label">custom-current-color</div><div class="pad"><span class="sample" id="c3">XX</span></div></div><div class="tile"><div class="label">selection-none</div><div class="pad"><span class="sample" id="c4">XX</span></div></div><div class="tile"><div class="label">selection-separate</div><div class="pad"><span class="sample" id="c5">XX</span></div></div><div class="tile"><div class="label">selection-unspecified</div><div class="pad"><span class="sample" id="c6">XX</span></div></div><div class="tile"><div class="label">selection-current-color</div><div class="pad"><span class="sample" id="c7">XX</span></div></div><div class="tile"><div class="label">custom-overlap-order</div><div class="pad"><span class="sample" id="c8">XX</span></div></div><div class="tile"><div class="label">custom-layer-order</div><div class="pad"><span class="sample" id="c9">XX</span></div></div><style>#c10{color:green;text-shadow:0 24px 0 rgb(0 0 255 / .5), 0 24px 0 red}#c11{color:green;text-shadow:0 24px 0 rgb(0 0 255 / .5), 0 24px 0 purple, 0 24px 0 red}</style><div class="
