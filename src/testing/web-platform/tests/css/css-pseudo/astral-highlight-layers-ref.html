<!doctype html>
<html class="reftest-wait"><meta charset="utf-8">
<title>Overlapping highlight colors</title>
<link rel="help" href="https://drafts.csswg.org/css-pseudo-4/#highlight-text">
<style>
@font-face { font-family:Ahem; src:url(/fonts/Ahem.ttf); }
html { background:white; }
body { margin:8px; display:grid; grid-template-columns:300px 300px; gap:8px; }
.tile { width:300px; height:70px; }
.label { font:12px sans-serif; color:black; height:22px; }
.sample { font:32px/1 Ahem; color:red; }
</style>
<div class="tile"><div class="label">explicit-override</div><span class="sample" style="color:green">XXXX</span></div>
<div class="tile"><div class="label">implicit-current</div><span class="sample" style="color:blue">XXXX</span></div>
<div class="tile"><div class="label">explicit-current</div><span class="sample" style="color:blue">XXXX</span></div>
<div class="tile"><div class="label">color-mix</div><span class="sample" style="color:color-mix(in srgb,blue,red)">XXXX</span></div>
<div class="tile"><div class="label">three-layers</div><span class="sample" style="color:color-mix(in srgb,color-mix(in srgb,blue,red),white)">XXXX</span></div>
<div class="tile"><div class="label">background-current</div><span class="sample" style="color:blue;background-color:blue">XX XX</span></div>
<div class="tile"><div class="label">background-mix</div><span class="sample" style="color:blue;background-color:color-mix(in srgb,blue,white)">XX XX</span></div>
<div class="tile"><div class="label">lower-shadow</div><span class="sample" style="color:green;text-shadow:0 8px 0 blue">XXXX</span></div>
<div class="tile"><div class="label">decoration-current</div><span class="sample" style="color:blue;text-decoration:underline blue solid 3px">XXXX</span></div>
<div class="tile"><div class="label">transparent-origin</div><span class="sample" style="color:blue;background-color:blue">XX XX</span></div>
<div class="tile"><div class="label">partial-overlap</div><span class="sample" style=""><span style="color:blue">XXX</span>X</span></div>
<div class="tile"><div class="label">priority-repaint</div><span class="sample" style="color:blue">XXXX</span></div>
<script>
addEventListener('load', async () => {
  await document.fonts.ready;
  requestAnimationFrame(() => document.documentElement.classList.remove('reftest-wait'));
});
</script>
