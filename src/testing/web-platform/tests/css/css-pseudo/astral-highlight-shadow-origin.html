v class="tile"><div class="label">custom-unspecified</div><div class="pad"><span class="sample" id="c2">XX</span></div></div><div class="tile"><div class="label">custom-current-color</div><div class="pad"><span class="sample" id="c3">XX</span></div></div><div class="tile"><div class="label">selection-none</div><div class="pad"><span class="sample" id="c4">XX</span></div></div><div class="tile"><div class="label">selection-separate</div><div class="pad"><span class="sample" id="c5">XX</span></div></div><div class="tile"><div class="label">selection-unspecified</div><div class="pad"><span class="sample" id="c6">XX</span></div></div><div class="tile"><div class="label">selection-current-color</div><div class="pad"><span class="sample" id="c7">XX</span></div></div><div class="tile"><div class="label">custom-overlap-order</div><div class="pad"><span class="sample" id="c8">XX</span></div></div><div class="tile"><div class="label">custom-layer-order</div><div class="pad"><span class="sample" id="c9">XX</span></div></div><style>#c10,#c11{text-shadow:0 24px 0 red}#c10::highlight(h10),#c11::highlight(h11){color:green;background-color:transparent;text-shadow:0 24px 0 rgb(0 0 255 / .5)}#c11::highlight(low11){color:purple;text-shadow:0 24px 0 purple}</style><div class="tile"><div class="label">custom-translucent-overlap</div><div class="pad"><span class="sample" id="c10">XX</span></div></div><div class="tile"><div class="label">custom-translucent-layers</div><div class="pad"><span class="sample" id="c11">XX</span></div></div><script>addEventListener('load',async()=>{await document.fonts.ready;for(let i=0;i<12;i++){if(i>=4&&i<=7)continue;const r=new Range();r.selectNodeContents(document.getElementById('c'+i));let h=new Highlight(r);h.priority=1;CSS.highlights.set('h'+i,h);if(i===9||i===11)CSS.highlights.set('low'+i,new Highlight(r));}const sel=new Range();sel.setStart(document.getElementById('c4').firstChild,0);sel.setEnd(document.getElementById('c7').firstChild,2);getSelection().addRange(sel);requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('reftest-wait')));});</script>
