.target::search-text{background:rgb(34,204,85);color:rgb(0,17,34);}.target::search-text:current{background:rgb(238,34,51);color:white;}
.target::selection{background:purple;color:white;}
</style><span class="target" id="target">WWWWW</span><span class="target" id="second">WWWWW</span><span class="target" id="control">WWWWW</span><script>window.changeHighlight=()=>{const style=document.createElement('style');style.textContent='.target::search-text:current {background:blue;color:yellow;text-shadow:12px 40px 0 pink}';document.head.append(style);};</script>
