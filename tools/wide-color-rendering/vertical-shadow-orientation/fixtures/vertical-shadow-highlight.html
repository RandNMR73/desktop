<!doctype html><meta charset="utf-8"><title>Vertical shadow orientation - highlight</title><style>html{background:white;color:black}body{margin:8px;display:grid;grid-template-columns:repeat(4,260px);gap:8px;font:12px Arial}.tile{height:174px;position:relative;background:white;outline:1px solid #ddd}.label{color:#444}.sample{position:absolute;left:70px;top:40px;font:32px/1 Arial;width:max-content;height:max-content;text-shadow:40px 25px 0 red}.sample::highlight(probe){text-shadow:40px 25px 0 red}.sample{text-shadow:none}</style><div class="tile" data-case="horizontal-f"><div class="label">horizontal-f highlight</div><span class="sample" style="writing-mode:horizontal-tb;text-orientation:mixed">F</span></div><div class="tile" data-case="vertical-rl-f"><div class="label">vertical-rl-f highlight</div><span class="sample" style="writing-mode:vertical-rl;text-orientation:mixed">F</span></div><div class="tile" data-case="vertical-lr-f"><div class="label">vertical-lr-f highlight</div><span class="sample" style="writing-mode:vertical-lr;text-orientation:mixed">F</span></div><div class="tile" data-case="sideways-lr-f"><div class="label">sideways-lr-f highlight</div><span class="sample" style="writing-mode:sideways-lr;text-orientation:mixed">F</span></div><div class="tile" data-case="vertical-rl-upright-f"><div class="label">vertical-rl-upright-f highlight</div><span class="sample" style="writing-mode:vertical-rl;text-orientation:upright">F</span></div><div class="tile" data-case="vertical-rl-cjk"><div class="label">vertical-rl-cjk highlight</div><span class="sample" style="writing-mode:vertical-rl;text-orientation:mixed">永</span></div><div class="tile" data-case="vertical-lr-cjk"><div class="label">vertical-lr-cjk highlight</div><span class="sample" style="writing-mode:vertical-lr;text-orientation:mixed">永</span></div><div class="tile" data-case="sideways-rl-cjk"><div class="label">sideways-rl-cjk highlight</div><span class="sample" style="writing-mode:sideways-rl;text-orientation:mixed">永</span></div><script>const ranges=[...document.querySelectorAll('.sample')].map(e=>{const r=new Range();r.selectNodeContents(e);return r});CSS.highlights.set('probe',new Highlight(...ranges));</script>
