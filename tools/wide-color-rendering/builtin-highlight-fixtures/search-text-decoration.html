<!doctype html><meta charset="utf-8"><title>search-text-decoration</title>
<style>html{background:white}body{margin:80px;font:40px/1 monospace}#target{color:rgb(70,80,90)}
#target::search-text{color:rgb(60, 70, 90);background-color:transparent;text-decoration:underline overline solid rgb(80, 20, 160);text-decoration-thickness:3px;text-underline-offset:9px;}</style>
<span id="target">WWWWW</span>
<script>
window.changeHighlight=()=>{const style=document.createElement('style');style.textContent='#target::search-text{color:rgb(160,20,70);background-color:rgb(150,220,230);text-shadow:0 -45px 0 rgb(150,20,100)}';document.head.append(style)};
</script>
