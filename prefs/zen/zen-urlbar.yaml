- name: zen.urlbar.replace-newtab
  value: true

- name: zen.urlbar.show-protections-icon
  value: false

- name: zen.urlbar.show-contextual-id
  value: false

- name: zen.urlbar.behavior
  value: floating-on-type

- name: zen.urlbar.wait-to-clear
  # Arc reopens its command bar with an empty query after cancellation.
  value: 0

# Tab on a search engine's alias enters its search mode (Arc's site search).
- name: zen.urlbar.tab-to-search
  value: true

# The site search chip's colour per engine, as "name-or-alias=#rrggbb" pairs
# separated by commas; engines not listed use their icon's dominant colour.
- name: zen.urlbar.site-search.colors
  value: ""

- name: zen.urlbar.show-domain-only-in-sidebar
  value: true

- name: zen.urlbar.hide-one-offs
  value: true

# Control Top Sites shortcuts in the URL bar independently of about:newtab.
- name: zen.urlbar.show-sponsored
  value: false

- name: zen.urlbar.show-pinned
  value: "@cond"
  condition: "!@IS_TWILIGHT@"

- name: zen.urlbar.enable-overrides
  value: false

- name: zen.urlbar.single-toolbar-show-copy-url
  value: true

- name: zen.urlbar.show-pip-button
  value: false

- name: zen.urlbar.open-on-startup
  value: true

# Mark: Zen suggestions controls

- name: zen.urlbar.suggestions.quick-actions
  value: true

- name: browser.urlbar.shortcuts.workspaces
  value: true
