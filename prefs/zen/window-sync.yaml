- name: zen.window-sync.enabled
  value: true

- name: zen.window-sync.log
  value: false

- name: zen.window-sync.prefer-unsynced-windows
  value: false

- name: zen.window-sync.open-link-in-new-unsynced-window
  value: true

- name: zen.window-sync.sync-only-pinned-tabs
  value: false

# Little windows (Arc's Little Arc): ⌥⌘N opens one; links from other apps
# open in one unless a space route claims them.
- name: zen.little-window.enabled
  value: true

- name: zen.little-window.external-links
  value: true

- name: zen.little-window.width
  value: 900

- name: zen.little-window.height
  value: 640

# Arc's "Archive Little Arcs after": a little window unseen this long is
# closed with its tabs (needs zen.tabs.auto-archive.enabled; 0 = never).
- name: zen.little-window.archive-minutes
  value: 720
