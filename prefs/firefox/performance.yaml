# See https://github.com/zen-browser/desktop/issues/11599, this pref seems to
# have disabled itself on macos for some unknown reason.
# Make sure its in sync with:
# https://searchfox.org/firefox-main/rev/dd2579cb6e7f1761a27ce64fb84d92c61d85c27f/modules/libpref/init/StaticPrefList.yaml#8396
- name: gfx.webrender.compositor
  condition: "defined(XP_WIN) || defined(XP_DARWIN) || defined(MOZ_WIDGET_GTK)"
  value: "@cond"
  mirror: once

# Briefly reuse an idle site process for rapid close/reopen navigation on macOS.
# Native five-Space testing improved this narrow workload; idle processes retain
# memory until expiry, including under memory pressure. Keep the window bounded.
# Site/container isolation and process-count limits remain Gecko defaults.
- name: dom.ipc.processReuse.unusedGraceMs
  condition: "defined(XP_MACOSX)"
  value: 5000

# Keep one preallocated content process instead of three: the two extra
# idle processes held ~60 MB (30.3 MB each) on a 16 GB Mac. Like Chromium's
# single spare renderer, which Arc uses.
- name: dom.ipc.processPrelaunch.fission.number
  value: 1

# With zen.urlbar.replace-newtab (the default) a new tab opens the command
# bar over Zen's empty tab, so the preloaded about:newtab is never shown.
# It and the privileged-about process kept alive for it held ~60 MB.
# about:newtab still loads on demand (~110 ms) when visited directly.
- name: browser.newtab.preload
  value: false

- name: dom.ipc.keepProcessesAlive.privilegedabout
  value: 0

# Give a large element whose opacity or 2D scale is animating (Peek's card and
# the page receding behind it, the compact sidebar's hover reveal) a
# WebRender picture-cache slice of its own, composited by Core Animation at
# that opacity and scale, instead of re-rasterizing every tile under it each
# frame. Engine patches: gfx/wr tile_cache, scene_building; NativeLayerCA
# opacity; APZ and BrowserChild skip the page repaint an ancestor's scale
# animation used to force every frame. Speed suite, Peek open/close longest
# frame p95: 41.5/42.4 -> 33.7/35.4 ms; hover reveal 35.6 -> 26.7 ms. Visual
# parity 231/0 with and without.
- name: gfx.webrender.opacity-group-slices
  condition: "defined(XP_MACOSX)"
  value: true

- name: gfx.webrender.opacity-group-scale-lock
  condition: "defined(XP_MACOSX)"
  value: true

# Keep the layers of the last four tabs shown, so switching back to one (the
# other Space's tab on Cmd+Option+Left/Right, the previous tab on Ctrl+Tab)
# composites the cached layers instead of waiting for its content process to
# paint again. Firefox's default is 0. Key-to-pixels, distinct pages, 2 x 30:
# Space switch 104.8/109.4 -> 80.8/80.1 ms, tab switch 77.5/71.9 ->
# 70.2/66.7 ms. Parent and GPU process memory unchanged on those pages
# (527/299 MB at 0, 2 and 4); heavy pages hold at most four tabs' layers.
- name: browser.tabs.remote.tabCacheSize
  value: 4
